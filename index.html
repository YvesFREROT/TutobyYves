<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chargement du tutoriel OpenAI complet</title>
<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f5f7;color:#172026}main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(680px,100%);background:#fff;border:1px solid #dbe1e5;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(24,36,42,.1)}h1{font-size:1.45rem;margin:0 0 12px}p{line-height:1.55;margin:8px 0}.status{color:#59646d}.error{color:#9b2c2c;white-space:pre-wrap}
</style>
</head>
<body>
<main><section class="card"><h1>Chargement de la version complète…</h1><p>Vérification et décompression du tutoriel original en six langues.</p><p id="status" class="status" aria-live="polite">Préparation des fichiers.</p></section></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const version='gzip-07607aad-v1-20260714';
  const expectedGzip='07607aaddd378c9e1464274597a7a6c49ecbd7b46ea305f20b421afbf1058675';
  const expectedHtml='f842789242721b5be6a93a34f34ca3f97ebfb5598edd51b038e6468bb04513af';
  const files=Array.from({length:11},(_,i)=>`payload/gzip-${String(i).padStart(2,'0')}.b64`);
  const hex=buffer=>[...new Uint8Array(buffer)].map(b=>b.toString(16).padStart(2,'0')).join('');
  try{
    if(!('DecompressionStream' in window)) throw new Error('Ce navigateur ne prend pas en charge la décompression gzip intégrée. Utilisez une version récente de Chrome, Edge, Firefox ou Safari.');
    const chunks=[];
    for(let i=0;i<files.length;i++){
      status.textContent=`Chargement ${i+1}/${files.length}…`;
      const response=await fetch(`${files[i]}?v=${version}`,{cache:'no-store'});
      if(!response.ok) throw new Error(`Fichier manquant : ${files[i]} (${response.status})`);
      chunks.push(await response.text());
    }
    const encoded=chunks.join('').replace(/\s+/g,'');
    const binary=atob(encoded);
    const gzipBytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) gzipBytes[i]=binary.charCodeAt(i);
    status.textContent='Vérification de l’archive…';
    const actualGzip=hex(await crypto.subtle.digest('SHA-256',gzipBytes));
    if(actualGzip!==expectedGzip) throw new Error(`Échec du contrôle de l’archive.\nAttendu : ${expectedGzip}\nObtenu : ${actualGzip}`);
    status.textContent='Décompression du tutoriel…';
    const decompressed=await new Response(new Blob([gzipBytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    status.textContent='Vérification du tutoriel…';
    const actualHtml=hex(await crypto.subtle.digest('SHA-256',decompressed));
    if(actualHtml!==expectedHtml) throw new Error(`Échec du contrôle du tutoriel.\nAttendu : ${expectedHtml}\nObtenu : ${actualHtml}`);
    const html=new TextDecoder('utf-8',{fatal:true}).decode(decompressed);
    document.open();document.write(html);document.close();
  }catch(error){status.className='error';status.textContent=error instanceof Error?error.message:String(error);}
})();
</script>
</body>
</html>
