<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chargement du tutoriel OpenAI — 7 langues</title>
<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f5f7;color:#172026}
main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(700px,100%);background:#fff;border:1px solid #dbe1e5;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(24,36,42,.1)}
h1{font-size:1.45rem;margin:0 0 12px}p{line-height:1.55;margin:8px 0}.status{color:#59646d}.error{color:#9b2c2c;white-space:pre-wrap}
</style>
</head>
<body>
<main><section class="card">
<h1>Chargement de la version complète…</h1>
<p>Chargement de la version hongroise révisée.</p>
<p id="status" class="status" aria-live="polite">Préparation des fichiers.</p>
</section></main>
<script>
(async()=>{
 const latest='seven-lang-hu-proofread-fix2-20260715';
 const status=document.getElementById('status');
 const url=new URL(window.location.href);
 if(url.searchParams.get('v')!==latest){
   url.searchParams.set('v',latest);
   window.location.replace(url.toString());
   return;
 }
 const files=Array.from({length:8},(_,i)=>`payload/fix2-page-${String(i).padStart(2,'0')}.part`);
 const expected='4453d2973c78d8c159273db6e90a2c0bee6c6d787ea95b74e416ec2d8e386468';
 const hex=buffer=>[...new Uint8Array(buffer)].map(b=>b.toString(16).padStart(2,'0')).join('');
 try{
   const parts=[];
   for(let i=0;i<files.length;i++){
     status.textContent=`Chargement du correctif hongrois ${i+1}/${files.length}…`;
     const response=await fetch(`${files[i]}?v=${latest}`,{cache:'no-store'});
     if(!response.ok)throw new Error(`Fichier manquant : ${files[i]} (${response.status})`);
     parts.push(await response.text());
   }
   const html=parts.join('');
   const actual=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)));
   if(actual!==expected)throw new Error(`Échec du contrôle de la page corrigée.\nAttendu : ${expected}\nObtenu : ${actual}`);
   document.open();
   document.write(html);
   document.close();
 }catch(error){
   status.className='error';
   status.textContent=error instanceof Error?error.message:String(error);
 }
})();
</script>
</body>
</html>
